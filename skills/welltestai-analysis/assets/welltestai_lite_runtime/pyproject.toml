[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "welltestai-lite"
version = "0.1.0"
description = "Local consultant-facing screening and reporting tool for well-test response families."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "joblib", "PyYAML", "matplotlib"]

[project.scripts]
welltestai = "welltestai_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

